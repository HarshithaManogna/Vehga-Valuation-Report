<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEHGA Inspection Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f5f5f5] text-[#1a1a1a] font-sans antialiased min-h-screen py-12 px-4">
    <!-- Action Bar -->
    <div class="max-w-[210mm] mx-auto mb-6 flex justify-between items-center print:hidden">
        <div class="flex flex-col">
            <h1 class="text-xl font-black text-slate-800 tracking-tight">Inspection Report</h1>
            <p id="header-subtitle" class="text-xs font-bold text-slate-500 uppercase tracking-widest"></p>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="window.print()" class="bg-white text-slate-700 px-6 py-3 rounded-xl shadow-sm border border-slate-200 hover:bg-slate-50 transition-all cursor-pointer flex items-center gap-3 font-black tracking-widest uppercase text-sm">
                <i data-lucide="file-text" class="w-4 h-4"></i>
                <span>Print / Save PDF</span>
            </button>
            <button id="download-btn" onclick="handleDownload()" class="bg-[#009688] text-white px-6 py-3 rounded-xl shadow-lg hover:shadow-[#009688]/20 hover:-translate-y-0.5 transition-all cursor-pointer flex items-center gap-3 font-black tracking-widest uppercase text-sm disabled:opacity-50">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span id="download-text">Direct Download</span>
            </button>
        </div>
    </div>

    <div id="report-container">
        <!-- Pages will be injected here by script.js -->
    </div>

    <!-- Floating Download Button -->
    <button id="floating-download-btn" onclick="handleDownload()" class="fixed bottom-8 right-8 bg-[#009688] text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform cursor-pointer z-[100] flex items-center gap-2 font-black tracking-widest uppercase text-sm print:hidden disabled:opacity-50">
        <i data-lucide="download" class="w-5 h-5"></i>
        <span id="floating-download-text">Download PDF</span>
    </button>

    <script src="script.js"></script>
</body>
</html>
